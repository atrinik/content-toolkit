name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: content-toolkit-semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Release content toolkit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_HOME: /tmp/atrinik-content-toolkit-cargo
      CARGO_TARGET_DIR: /tmp/atrinik-content-toolkit-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Verify release branch policy
        run: node scripts/release/test-release-policy.cjs
      - name: Install pinned release dependencies
        run: tools/install-ci-dependencies.sh
      - name: Fetch the complete locked cross-target graph
        run: cargo fetch --locked
      - name: Revalidate exact release revision
        run: tools/validate.sh
      - name: Analyze commits, package, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          --package=semantic-release@25.0.9
          --package=@semantic-release/exec@7.1.0
          --package=conventional-changelog-conventionalcommits@9.3.1
          semantic-release
