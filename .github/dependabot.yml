version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Groups version updates into one pull request. Security updates are never
    # grouped with them, so two Cargo pull requests can still be open at once.
    # The strict required-checks ruleset makes the second one update from main
    # before it merges, and that update re-runs the Dependabot crate version
    # workflow against the new base, so it takes the next version.
    groups:
      rust:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
